# Render Blueprint for the ChargebackLens API (FastAPI).
# In Render: New > Blueprint > pick this repository > Apply.
#
# The Python version comes from .python-version at the repo root (3.12).
# The front end in web/ deploys separately; see the README.
services:
  - type: web
    name: chargebacklens-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
